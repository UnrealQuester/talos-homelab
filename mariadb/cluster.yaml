---
apiVersion: v1
kind: Namespace
metadata:
  name: mariadb-operator
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
spec:
  storage:
    ephemeral: true
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: test
spec:
  mariaDbRef:
    name: mariadb
  characterSet: utf8
  collate: utf8_general_ci
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: mike
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: mike
    key: password
  maxUserConnections: 100
  host: "%"
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s
---
apiVersion: v1
kind: Secret
metadata:
  name: mike
type: Opaque
data:
  # s3cre3t!
  password: czNjcmUzdCEK
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: mike
spec:
  mariaDbRef:
    name: mariadb
  privileges:
  - "ALL PRIVILEGES"
  database: "test"
  table: "*"
  username: maxscale_user
  grantOption: true
  host: "%"
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s
---
apiVersion: v1
kind: Secret
metadata:
  name: maxscale-user
type: Opaque
data:
  # maxscale_password
  password: bWF4c2NhbGVfcGFzc3dvcmQK
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: maxscale-user
spec:
  name: maxscale_user
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: maxscale-user
    key: password
  maxUserConnections: 100
  host: "%"
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-maxscale-user
spec:
  mariaDbRef:
    name: mariadb
  privileges:
  - "BINLOG ADMIN"
  - "BINLOG MONITOR"
  - "CONNECTION ADMIN"
  - "READ_ONLY ADMIN"
  - "REPLICATION SLAVE ADMIN"
  - "SLAVE MONITOR"
  - "RELOAD"
  - "PROCESS"
  - "SUPER"
  - "EVENT"
  - "SET USER"
  - "SHOW DATABASES"
  database: "*"
  table: "*"
  username: maxscale_user
  grantOption: true
  host: "%"
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: grant-maxscale-user-select
spec:
  mariaDbRef:
    name: mariadb
  privileges:
  - "SELECT"
  database: "mysql"
  table: "*"
  username: maxscale_user
  grantOption: true
  host: "%"
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s